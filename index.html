html<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 节气幸运大转盘 (强制直立竖排) 🎉</title>
    <style>
        body { background: linear-gradient(135deg, #1f1c2c, #928dab); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #fff; }
        h2 { margin-bottom: 20px; font-size: 24px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); letter-spacing: 2px; }
        .input-box { background: rgba(255, 255, 255, 0.15); padding: 15px 25px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; backdrop-filter: blur(5px); }
        .input-box input { padding: 10px; border: none; border-radius: 5px; font-size: 16px; width: 180px; text-align: center; outline: none; }
        .input-box button { padding: 10px 15px; border: none; background: #ff9800; color: white; font-size: 16px; border-radius: 5px; cursor: pointer; margin-left: 10px; font-weight: bold; }
        .wheel-container { position: relative; width: 340px; height: 340px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 50%; background: #ff9800; padding: 12px; display: none; }
        #wheelCanvas { background: #2b293a; border-radius: 50%; display: block; }
        .pointer { position: absolute; width: 70px; height: 70px; top: 50%; left: 50%; margin-top: -35px; margin-left: -35px; background: #ff5722; border-radius: 50%; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 4px solid #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; color: #fff; }
        .pointer::after { content: ''; position: absolute; width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 25px solid #ff5722; top: -22px; left: 17px; }
        #status-msg { margin-top: 15px; font-weight: bold; color: #ffeb3b; text-align: center; padding: 0 20px; }
        .mask { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .popup { background: #fff; color: #333; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); max-width: 280px; }
        .popup h3 { margin: 0 0 10px 0; color: #ff9800; font-size: 22px; }
        .popup p { margin: 0 0 20px 0; font-size: 20px; font-weight: bold; color: #1f1c2c; }
        .popup button { background: #ff9800; color: #fff; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <h2>🎉 排位抽签 🎉</h2>
    
    <div class="input-box" id="login-area">
        <input type="text" id="username" placeholder="请输入您的名字" maxlength="10">
        <button onclick="startApp()">进入抽签</button>
    </div>

    <div class="wheel-container" id="wheel-wrapper">
        <canvas id="wheelCanvas" width="340" height="340"></canvas>
        <div class="pointer" id="spin-btn" onclick="spinWheel()">抽奖</div>
    </div>

    <p id="status-msg"></p>

    <div class="mask" id="mask">
        <div class="popup">
            <h3>🎊 恭喜抽中 🎊</h3>
            <p id="prize-text">节气名称</p>
            <button onclick="closePopup()">确定</button>
        </div>
    </div>

    <script>
        const SHEET_API_URL = "https://api.sheetbest.com/sheets/f0580e65-268a-4161-9f3a-bcac2ce0072b";
        let currentUserName = "", isRotating = false, startAngle = 0; 

        let prizesData = [
            { name: '立春 🌸', bg: '#3a364d' }, { name: '雨水 🌧️', bg: '#4a465c' },
            { name: '惊蛰 ⚡', bg: '#3a364d' }, { name: '春分 ⚖️', bg: '#4a465c' },
            { name: '清明 🍃', bg: '#3a364d' }, { name: '谷雨 🌾', bg: '#4a465c' },
            { name: '立夏 ☀️', bg: '#3a364d' }, { name: '小满 🥖', bg: '#4a465c' },
            { name: '芒种 🌾', bg: '#3a364d' }, { name: '夏至 🌻', bg: '#4a465c' },
            { name: '小暑 🥵', bg: '#3a364d' }, { name: '大暑 🔥', bg: '#4a465c' },
            { name: '立秋 🍁', bg: '#3a364d' }, { name: '处暑 🍂', bg: '#4a465c' },
            { name: '白露 💧', bg: '#3a364d' }
        ];

        async function startApp() {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) { alert("请先输入名字！"); return; }
            if (localStorage.getItem('has_drawn')) { alert("您已经参加过抽奖，每个人只能转一次哦！"); return; }
            document.getElementById('status-msg').innerText = "正在实时同步云端剩余奖项，请稍候...";
            try {
                const response = await fetch(SHEET_API_URL);
                const data = await response.json();
                if (Array.isArray(data) && data.length > 0) {
                    const drawnList = data.map(row => {
                        const val = row["排位"] || row["prize"];
                        return val ? String(val).trim() : null;
                    }).filter(Boolean);
                    prizesData = prizesData.filter(item => {
                        return !drawnList.some(drawn => {
                            return drawn.includes(item.name) || item.name.includes(drawn) || drawn.includes(item.name.substring(0, 2)) || item.name.includes(drawn.substring(0, 2));
                        });
                    });
                }
            } catch (err) { console.log(err); }
            currentUserName = nameInput;
            document.getElementById('login-area').style.display = 'none';
            document.getElementById('wheel-wrapper').style.display = 'block';
            document.getElementById('status-msg').innerText = `欢迎你，${currentUserName}！请点击中心开始抽奖`;
            forceDrawVerticalWheel();
        }

        function forceDrawVerticalWheel() {
            const canvas = document.getElementById("wheelCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const len = prizesData.length;
            if (len === 0) {
                document.getElementById('wheel-wrapper').style.display = 'none';
                document.getElementById('status-msg').innerText = "所有节气已被抽完，活动结束！";
                return;
            }
            const arc = Math.PI * 2 / len; 
            ctx.clearRect(0, 0, 340, 340);
            for (let i = 0; i < len; i++) {
                let angle = startAngle + i * arc;
                ctx.fillStyle = prizesData[i].bg;
                ctx.beginPath(); ctx.arc(170, 170, 170, angle, angle + arc, false); ctx.lineTo(170, 170); ctx.fill();
                ctx.save();
                ctx.fillStyle = "#ffeb3b"; 
                ctx.font = 'bold 18px sans-serif'; // ⭐ 16px加粗大字
                ctx.translate(170, 170); 
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                const charArray = Array.from(prizesData[i].name).filter(c => c.trim() !== "");
                for (let j = 0; j < charArray.length; j++) {
                    // ⭐ 强制每个字垂直向圆心直立排布
                    ctx.fillText(charArray[j], -ctx.measureText(charArray[j]).width / 2, -135 + (j * 22));
                }
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isRotating) return;
            isRotating = true;
            const len = prizesData.length;
            const targetIndex = Math.floor(Math.random() * len); 
            const arc = 360 / len;
            const totalRotation = 360 * 5 + (270 - (targetIndex * arc + arc / 2)); 
            let currentRotation = 0, duration = 3000, startTime = performance.now();
            function animate(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                currentRotation = (1 - Math.pow(1 - progress, 3)) * totalRotation;
                startAngle = (currentRotation * Math.PI) / 180;
                forceDrawVerticalWheel();
                if (progress < 1) { requestAnimationFrame(animate); } else {
                    isRotating = false;
                    const winPrizeName = prizesData[targetIndex].name;
                    localStorage.setItem('has_drawn', 'true'); 
                    document.getElementById('prize-text').innerText = winPrizeName;
                    document.getElementById('mask').style.display = 'flex';
                    fetch(SHEET_API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ "姓名": currentUserName, "排位": winPrizeName }) }).catch(err => console.log(err));
                }
            }
            requestAnimationFrame(animate);
        }

        function closePopup() { document.getElementById('mask').style.display = 'none'; location.reload(); }
    </script>
</body>
</html>
